<mat-toolbar class="navbar" [class.scrolled]="isScrolled()">
  <a class="logo" href="/" (click)="$event.preventDefault(); goHome()" aria-label="FAT – home">
    <img src="assets/fat_pink.png" alt="FAT" class="navbar-logo" />
  </a>
  <span class="spacer"></span>
  <nav class="nav-links desktop-nav">
    <button mat-button (click)="scrollTo('music')">MUSIC</button>
    <button mat-button (click)="scrollTo('tour')">TOUR</button>
    <button mat-button (click)="scrollTo('videos')">VIDEOS</button>
    <button mat-button (click)="scrollTo('about')">ABOUT</button>
  </nav>
  <button mat-icon-button class="hamburger" (click)="toggleMenu()"
          [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
          [attr.aria-expanded]="mobileMenuOpen()">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      @if (mobileMenuOpen()) {
        <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
      } @else {
        <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
      }
    </svg>
  </button>
</mat-toolbar>
<div class="mobile-menu" [class.open]="mobileMenuOpen()">
  <button mat-button (click)="scrollTo('music')">MUSIC</button>
  <button mat-button (click)="scrollTo('tour')">TOUR</button>
  <button mat-button (click)="scrollTo('videos')">VIDEOS</button>
  <button mat-button (click)="scrollTo('about')">ABOUT</button>
</div>
