<section id="music" class="music-section">
  <div class="section-container">
    <h2 class="section-heading">MUSIC</h2>
    <div class="music-content">
      <div class="bandcamp-embed">
        <app-embed-consent
          [src]="bandcampUrl"
          title="F.A.T — DROWNED IN DECAY"
          provider="Bandcamp">
        </app-embed-consent>
      </div>
      <div class="music-info">
        <h3 class="track-title">DROWNED IN DECAY</h3>
        <p class="track-band">F.A.T</p>
        <p class="track-desc">Our latest single — stream it now on Bandcamp.</p>
        <div class="music-actions">
          <a href="https://fatmusicda.bandcamp.com/track/drowned-in-decay" target="_blank" rel="noopener" mat-raised-button color="accent">LISTEN ON BANDCAMP</a>
          <a href="https://www.youtube.com/watch?v=lnbvvY3v80E" target="_blank" rel="noopener" mat-stroked-button class="yt-btn">WATCH ON YOUTUBE</a>
        </div>
      </div>
    </div>
    <div class="more-music">
      <a href="https://fatmusicda.bandcamp.com" target="_blank" rel="noopener" class="more-link">MORE MUSIC →</a>
    </div>
  </div>
</section>
